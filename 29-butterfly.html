<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Butterfly / tornado chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="lib/fonts.googleapis.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div><h1>Butterfly / tornado chart</h1><p>Two groups compared back-to-back from a centre axis — highlights differences clearly.</p></div>
    <span class="badge">Bar</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Demographics by age group</h2><p>Male vs female customers, %</p></div></div>
  <div class="legend" id="legend"></div>
  <div class="chart-wrap" style="height:340px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script type="module">
import * as U from './js/utils.js';

const ages=['18–24','25–34','35–44','45–54','55–64','65+'];
const male  =[ 8.2, 14.5, 13.8, 11.2, 8.4, 5.1];
const female=[ 9.1, 15.8, 14.2, 12.0, 9.3, 6.4];

const chart=new Chart('chart',{
  type:'bar',
  data:{
    labels:ages,
    datasets:[
      {label:'Male',  data:male.map(v=>-v), backgroundColor:U.C.blue+'cc', borderRadius:3, borderSkipped:false},
      {label:'Female',data:female,           backgroundColor:U.C.pink+'cc', borderRadius:3, borderSkipped:false},
    ]
  },
  options:U.baseOpts({
    indexAxis:'y',
    scales:{
      x:{...U.yAxis(),ticks:{...U.TICK,callback:v=>Math.abs(v).toFixed(1)+'%'}},
      y:U.xAxis(),
    },
    plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${Math.abs(ctx.parsed.x).toFixed(1)}%`}}}
  })
});
U.buildLegend(chart,'legend');

</script>
</body>
</html>
