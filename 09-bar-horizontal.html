<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizontal bar chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="lib/fonts.googleapis.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <h1>Horizontal bar chart</h1>
      <p>Rotated axis — ideal for ranking, long category names, or comparing many items.</p>
    </div>
    <span class="badge">Bar</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Top products by revenue</h2><p>YTD 2024, $K</p></div></div>
  <div class="chart-wrap" style="height:360px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script type="module">
import * as U from './js/utils.js';

const products = ['Linen Blazer','Silk Midi Dress','Wool Overcoat','Canvas Tote','Cashmere Knit','Leather Belt','Wide-Leg Trousers','Cotton Shirt'];
const values   = [142,128,115,98,87,74,63,55];
const colors   = products.map((_,i)=>[U.C.purple,U.C.purple,U.C.purple,U.C.teal,U.C.teal,U.C.coral,U.C.coral,U.C.coral][i]);

new Chart('chart',{
  type:'bar',
  data:{
    labels:products,
    datasets:[{ label:'Revenue', data:values, backgroundColor:colors, borderRadius:4, borderSkipped:false }]
  },
  options: U.baseOpts({
    indexAxis:'y',
    scales:{
      x: U.yAxis({ ticks:{ ...U.TICK, callback:v=>'$'+v+'K' } }),
      y: U.xAxis({ ticks:{ font:{ size:12 } } }),
    }
  })
});

</script>
</body>
</html>
