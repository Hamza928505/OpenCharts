<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scatter chart (clusters)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="lib/fonts.googleapis.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <h1>Scatter chart (clusters)</h1>
      <p>Colour-coded groups reveal natural clusters or segments in multi-dimensional data.</p>
    </div>
    <span class="badge">Scatter</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Customer segments</h2><p>Purchase frequency vs average order value</p></div></div>
  <div class="legend" id="legend"></div>
  <div class="chart-wrap" style="height:360px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script type="module">
import * as U from './js/utils.js';

const chart = new Chart('chart',{
  type:'scatter',
  data:{
    datasets:[
      { label:'High-value',   data:U.randPts(30,75,80,12), backgroundColor:'rgba(127,119,221,.65)', pointRadius:6 },
      { label:'Regular',      data:U.randPts(40,45,45,15), backgroundColor:'rgba(29,158,117,.65)',  pointRadius:6 },
      { label:'Occasional',   data:U.randPts(35,20,25,12), backgroundColor:'rgba(216,90,48,.65)',   pointRadius:6 },
    ]
  },
  options: U.baseOpts({
    scales:{
      x: U.yAxis({ min:0, max:100, title:{ display:true, text:'Avg order value ($)', font:{ size:11 } } }),
      y: U.yAxis({ min:0, max:100, title:{ display:true, text:'Purchase frequency', font:{ size:11 } } }),
    }
  })
});
U.buildLegend(chart,'legend');

</script>
</body>
</html>
