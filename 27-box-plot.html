<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Box plot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="lib/fonts.googleapis.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div><h1>Box plot</h1><p>Shows median, quartiles, and outliers for each group — reveals spread and skew.</p></div>
    <span class="badge">Statistical</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Order value by region</h2><p>Distribution of order values, 2024</p></div></div>
  <div class="chart-wrap" style="height:360px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script src="https://unpkg.com/@sgratzl/chartjs-chart-boxplot@4.2.4/build/index.umd.min.js"></script>
<script type="module">
import * as U from './js/utils.js';

const regions=['North','South','East','West','Central'];
const colors=[U.C.purple,U.C.teal,U.C.coral,U.C.blue,U.C.amber];
const gauss=(mu,sig)=>{const u=Math.random(),v=Math.random();return mu+sig*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const datasets=regions.map((r,i)=>({
  label:r,
  data:[Array.from({length:80},()=>Math.max(10,Math.round(gauss([68,55,75,62,70][i],[18,14,22,16,20][i]))))],
  backgroundColor:colors[i]+'44',borderColor:colors[i],borderWidth:1.5,
  outlierBackgroundColor:colors[i],outlierBorderColor:colors[i],outlierRadius:3,
  medianColor:colors[i],
}));
new Chart('chart',{
  type:'boxplot',
  data:{labels:regions,datasets:datasets},
  options:U.baseOpts({scales:{x:U.xAxis(),y:{...U.yAxis(),ticks:{...U.TICK,callback:v=>'$'+v}}}}),
});

</script>
</body>
</html>
