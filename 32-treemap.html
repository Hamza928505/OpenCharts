<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Treemap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="lib/fonts.googleapis.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div><h1>Treemap</h1><p>Nested rectangles sized by value — shows hierarchical part-to-whole relationships at a glance.</p></div>
    <span class="badge">Hierarchical</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Revenue by product category</h2><p>FY 2024 — area = revenue</p></div></div>
  <div class="chart-wrap" style="height:380px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script src="https://unpkg.com/chartjs-chart-treemap@2.3.0/dist/chartjs-chart-treemap.min.js"></script>
<script type="module" src="js/32-treemap.js"></script>
</body>
</html>
