<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Candlestick / OHLC chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="lib/fonts.googleapis.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div><h1>Candlestick / OHLC chart</h1><p>Open-High-Low-Close bars — the standard for financial price data and stock analysis.</p></div>
    <span class="badge">Financial</span>
  </header>
  
<div class="metrics">
  <div class="metric"><div class="metric-label">Open</div><div class="metric-value" id="m-o">—</div></div>
  <div class="metric"><div class="metric-label">High</div><div class="metric-value up" id="m-h">—</div></div>
  <div class="metric"><div class="metric-label">Low</div><div class="metric-value down" id="m-l">—</div></div>
  <div class="metric"><div class="metric-label">Close</div><div class="metric-value" id="m-c">—</div></div>
</div>
<div class="card">
  <div class="card-header"><div><h2>Stock price — 60 trading days</h2><p>Hover for OHLC details</p></div></div>
  <canvas id="chart" style="width:100%;height:340px"></canvas>
</div>
</div>

<script type="module">
import * as U from './js/utils.js';

const canvas=document.getElementById('chart');
const W=canvas.offsetWidth,H=340;
canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;
canvas.style.width=W+'px';canvas.style.height=H+'px';
const ctx=canvas.getContext('2d');
ctx.scale(devicePixelRatio,devicePixelRatio);

let price=148;
const candles=Array.from({length:60},(_,i)=>{
  const open=price;
  const change=(Math.random()-.48)*4;
  price=Math.max(120,Math.min(200,price+change));
  const close=price;
  const high=Math.max(open,close)+Math.random()*2;
  const low=Math.min(open,close)-Math.random()*2;
  return {o:+open.toFixed(2),h:+high.toFixed(2),l:+low.toFixed(2),c:+close.toFixed(2)};
});

const allVals=candles.flatMap(c=>[c.h,c.l]);
const minV=Math.min(...allVals)-2, maxV=Math.max(...allVals)+2;
const pad={t:16,r:16,b:32,l:56};
const cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
const toY=v=>pad.t+ch-(v-minV)/(maxV-minV)*ch;
const barW=Math.max(3,(cw/candles.length)-2);

function draw(hover=-1){
  ctx.clearRect(0,0,W,H);
  // grid
  for(let v=Math.ceil(minV/10)*10;v<=maxV;v+=10){
    const y=toY(v);
    ctx.strokeStyle='rgba(128,128,128,.1)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle='rgba(128,128,128,.6)';ctx.font='10px DM Sans,sans-serif';ctx.textAlign='right';
    ctx.fillText('$'+v,pad.l-4,y+4);
  }
  candles.forEach((c,i)=>{
    const x=pad.l+i*(cw/candles.length)+barW/2;
    const up=c.c>=c.o;
    const col=hover===i?(up?'#0a7a52':'#b02020'):(up?U.C.teal:U.C.coral);
    ctx.strokeStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,toY(c.h));ctx.lineTo(x,toY(c.l));ctx.stroke();
    ctx.fillStyle=col+'cc';
    const y1=toY(Math.max(c.o,c.c)),y2=toY(Math.min(c.o,c.c));
    ctx.fillRect(x-barW/2,y1,barW,Math.max(1,y2-y1));
  });
  if(hover>=0){
    const c=candles[hover];
    document.getElementById('m-o').textContent='$'+c.o;
    document.getElementById('m-h').textContent='$'+c.h;
    document.getElementById('m-l').textContent='$'+c.l;
    document.getElementById('m-c').textContent='$'+c.c;
  }
}
draw();
const last=candles[candles.length-1];
document.getElementById('m-o').textContent='$'+last.o;
document.getElementById('m-h').textContent='$'+last.h;
document.getElementById('m-l').textContent='$'+last.l;
document.getElementById('m-c').textContent='$'+last.c;

canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left);
  const i=Math.floor((mx-pad.l)/(cw/candles.length));
  if(i>=0&&i<candles.length) draw(i); else draw();
});
canvas.addEventListener('mouseleave',()=>draw());

</script>
</body>
</html>
