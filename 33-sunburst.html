<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Sunburst chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="lib/fonts.googleapis.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div><h1>Sunburst chart</h1><p>Radial hierarchy — inner rings are parents, outer rings are children. Click to zoom.</p></div>
    <span class="badge">Hierarchical</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Product hierarchy</h2><p>Revenue by category → subcategory → product</p></div></div>
  <div id="chart" style="width:100%;height:420px;display:flex;align-items:center;justify-content:center;"></div>
</div>
</div>
<script src="lib/d3.min.js"></script>
<script type="module" src="js/33-sunburst.js"></script>
</body>
</html>
