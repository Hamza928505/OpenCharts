<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Lollipop chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="lib/fonts.googleapis.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div><h1>Lollipop chart</h1><p>Dot-and-stem variant of a bar chart — lighter visual weight, great for ranked data.</p></div>
    <span class="badge">Bar</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Customer satisfaction by department</h2><p>NPS score 0–100</p></div></div>
  <canvas id="chart" style="width:100%;height:360px"></canvas>
</div>
</div>

<script type="module" src="js/30-lollipop.js"></script>
</body>
</html>
