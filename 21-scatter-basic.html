<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scatter chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="lib/fonts.googleapis.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <h1>Scatter chart</h1>
      <p>X/Y point cloud — reveals correlation, clustering, or outliers in two-variable data.</p>
    </div>
    <span class="badge">Scatter</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Price vs customer rating</h2><p>200 products</p></div></div>
  <div class="chart-wrap" style="height:360px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script type="module" src="js/21-scatter-basic.js"></script>
</body>
</html>
