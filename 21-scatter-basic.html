<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scatter chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="lib/fonts.googleapis.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <h1>Scatter chart</h1>
      <p>X/Y point cloud — reveals correlation, clustering, or outliers in two-variable data.</p>
    </div>
    <span class="badge">Scatter</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Price vs customer rating</h2><p>200 products</p></div></div>
  <div class="chart-wrap" style="height:360px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script type="module">
import * as U from './js/utils.js';

const points = Array.from({length:120},()=>({
  x: +(20+Math.random()*230).toFixed(0),
  y: +(2.5+Math.random()*2.4).toFixed(1),
}));

new Chart('chart',{
  type:'scatter',
  data:{ datasets:[{ label:'Product', data:points, backgroundColor:'rgba(127,119,221,.55)', pointRadius:5, pointHoverRadius:7 }] },
  options: U.baseOpts({
    scales:{
      x: U.yAxis({ min:0, max:260, ticks:{ ...U.TICK, callback:v=>'$'+v } }),
      y: U.yAxis({ min:2, max:5.2, ticks:{ ...U.TICK, stepSize:0.5 } }),
    }
  })
});

</script>
</body>
</html>
