<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gauge / half-doughnut chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="lib/fonts.googleapis.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <h1>Gauge / half-doughnut chart</h1>
      <p>180° arc gauge — displays a single KPI against a maximum. Widely used in dashboards.</p>
    </div>
    <span class="badge">Circular</span>
  </header>
  
<div class="metrics">
  <div class="metric"><div class="metric-label">Current</div><div class="metric-value" id="m-val">72%</div></div>
  <div class="metric"><div class="metric-label">Target</div><div class="metric-value">80%</div></div>
  <div class="metric"><div class="metric-label">Status</div><div class="metric-value up">On track</div></div>
</div>
<div class="card">
  <div class="card-header"><div><h2>Customer satisfaction score</h2><p>Q4 2024 — CSAT gauge</p></div></div>
  <div class="controls">
    <label style="font-size:12px;color:var(--muted)">Score:</label>
    <input type="range" min="0" max="100" value="72" id="slider" style="width:160px" />
    <span id="slider-val" style="font-size:12px;min-width:32px">72%</span>
  </div>
  <div class="chart-wrap" style="height:260px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script type="module" src="js/16-doughnut-gauge.js"></script>
</body>
</html>
