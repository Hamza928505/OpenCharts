<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCharts Board</title>
<meta name="description" content="Put several saved OpenCharts charts on one page, and export the page.">

<!-- The header's brand mark, generated by tools/build-favicon.mjs. -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Apply the stored theme before first paint so there is no flash. -->
<script>
  try {
    var t = localStorage.getItem('opencharts.theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* private mode — fall through to the OS preference */ }
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/studio.css">

<!-- Rendering engines. Chart.js must load before any of its plugins. -->
<script src="lib/chart.umd.min.js"></script>
<script src="lib/d3.min.js"></script>

<style>
  /* Page-level chrome the board shares with the gallery. */
  .topbar {
    display: flex; align-items: center; gap: 1rem;
    padding: .85rem 2.4rem;
    border-bottom: 1px solid var(--rule);
    background: var(--surface);
  }
  .topbar .brand { padding: 0; }
  .topbar nav { margin-left: auto; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  @media (max-width: 900px) {
    .topbar { padding-left: 1.15rem; padding-right: 1.15rem; }
  }
  @media (max-width: 640px) {
    .topbar { padding: .7rem 1.15rem; gap: .6rem; }
    .topbar .brand-sub { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M1.6 12.4l3.6-4.2 2.8 2.6 6.4-7.2"/>
      </svg>
    </span>
    <span>
      <span class="brand-name">OpenCharts</span>
      <span class="brand-sub">board</span>
    </span>
  </a>
  <nav>
    <a class="btn btn-sm btn-ghost" href="index.html">Library</a>
    <a class="btn btn-sm btn-primary" href="studio.html">Open studio</a>
    <span id="theme-mount"></span>
  </nav>
</header>

<main class="board">
  <!-- Title, byline, the picker and the exports; built by BoardApp. -->
  <section class="board-head" id="board-head" aria-label="Board settings"></section>

  <!-- One card per saved chart. Each renders independently: there is no
       cross-filtering here, by design — see board.js. -->
  <section class="board-grid" id="board-grid" aria-label="Charts on this board"></section>
</main>

<script type="module">
  import { BoardApp } from './js/studio/BoardApp.js';
  // Exposed the way the gallery and the studio expose theirs, so the suite can
  // ask the page what it is drawing rather than guess from its pixels.
  window.openChartsBoard = new BoardApp();
</script>

</body>
</html>
