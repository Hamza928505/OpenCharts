<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100% stacked bar chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="lib/fonts.googleapis.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <h1>100% stacked bar chart</h1>
      <p>Each bar normalised to 100% — focuses on proportional composition, not absolute values.</p>
    </div>
    <span class="badge">Bar</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Market share by region</h2><p>Proportional split, 2024</p></div></div>
  <div class="legend" id="legend"></div>
  <div class="chart-wrap" style="height:320px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script type="module" src="js/10-bar-100stacked.js"></script>
</body>
</html>
