<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100% stacked bar chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="lib/fonts.googleapis.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <h1>100% stacked bar chart</h1>
      <p>Each bar normalised to 100% — focuses on proportional composition, not absolute values.</p>
    </div>
    <span class="badge">Bar</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Market share by region</h2><p>Proportional split, 2024</p></div></div>
  <div class="legend" id="legend"></div>
  <div class="chart-wrap" style="height:320px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script type="module">
import * as U from './js/utils.js';

const raw = {
  'North': [40,25,20,15],
  'South': [35,30,20,15],
  'East':  [45,22,18,15],
  'West':  [38,28,22,12],
};
const brands=['Brand A','Brand B','Brand C','Brand D'];
const colors=[U.C.purple,U.C.teal,U.C.coral,U.C.blue];

const regions = Object.keys(raw);
const totals  = regions.map(r=>raw[r].reduce((a,b)=>a+b,0));

const chart = new Chart('chart',{
  type:'bar',
  data:{
    labels:regions,
    datasets:brands.map((b,i)=>({
      label:b,
      data:regions.map((r,ri)=>+(raw[r][i]/totals[ri]*100).toFixed(1)),
      backgroundColor:colors[i],
      borderRadius: i===brands.length-1 ? 4 : 0,
      stack:'s',
    }))
  },
  options: U.baseOpts({
    scales:{
      x: U.xAxis({ stacked:true }),
      y: U.yAxis({ stacked:true, max:100, ticks:{ ...U.TICK, callback:v=>v+'%' } }),
    }
  })
});
U.buildLegend(chart,'legend');

</script>
</body>
</html>
