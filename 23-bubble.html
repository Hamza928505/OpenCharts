<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubble chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="lib/fonts.googleapis.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <h1>Bubble chart</h1>
      <p>Three-dimensional data (X, Y, and bubble size R) plotted as circles of varying area.</p>
    </div>
    <span class="badge">Bubble</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Product portfolio analysis</h2><p>Revenue (x), Margin (y), Market share (size)</p></div></div>
  <div class="legend" id="legend"></div>
  <div class="chart-wrap" style="height:380px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script type="module" src="js/23-bubble.js"></script>
</body>
</html>
