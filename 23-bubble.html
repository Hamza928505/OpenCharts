<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubble chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="lib/fonts.googleapis.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <h1>Bubble chart</h1>
      <p>Three-dimensional data (X, Y, and bubble size R) plotted as circles of varying area.</p>
    </div>
    <span class="badge">Bubble</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Product portfolio analysis</h2><p>Revenue (x), Margin (y), Market share (size)</p></div></div>
  <div class="legend" id="legend"></div>
  <div class="chart-wrap" style="height:380px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script type="module">
import * as U from './js/utils.js';

const chart = new Chart('chart',{
  type:'bubble',
  data:{
    datasets:[
      { label:'Women', data:[{x:68,y:42,r:22},{x:45,y:55,r:14},{x:80,y:35,r:10}], backgroundColor:'rgba(127,119,221,.65)', borderColor:U.C.purple, borderWidth:1 },
      { label:'Men',   data:[{x:52,y:38,r:18},{x:30,y:60,r:12},{x:70,y:48,r:8}],  backgroundColor:'rgba(29,158,117,.65)',  borderColor:U.C.teal,   borderWidth:1 },
      { label:'Living',data:[{x:38,y:65,r:9}, {x:60,y:30,r:15},{x:20,y:50,r:7}],  backgroundColor:'rgba(216,90,48,.65)',   borderColor:U.C.coral,  borderWidth:1 },
    ]
  },
  options: U.baseOpts({
    layout:{ padding:20 },
    scales:{
      x: U.yAxis({ min:0, max:100, title:{ display:true, text:'Revenue contribution (%)', font:{ size:11 } } }),
      y: U.yAxis({ min:0, max:100, title:{ display:true, text:'Gross margin (%)', font:{ size:11 } } }),
    }
  })
});
U.buildLegend(chart,'legend');

</script>
</body>
</html>
