<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stepped line chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="lib/fonts.googleapis.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <h1>Stepped line chart</h1>
      <p>Step interpolation ideal for discrete state changes, pricing tiers, or inventory snapshots.</p>
    </div>
    <span class="badge">Line</span>
  </header>
  
<div class="card">
  <div class="card-header">
    <div><h2>Price tier history</h2><p>Product pricing steps over time</p></div>
    <div class="controls">
      <button class="btn active" data-step="before">Before</button>
      <button class="btn" data-step="middle">Middle</button>
      <button class="btn" data-step="after">After</button>
    </div>
  </div>
  <div class="chart-wrap" style="height:340px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script type="module">
import * as U from './js/utils.js';

const labels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const data   = [29,29,29,39,39,39,49,49,59,59,69,79];

const chart = new Chart('chart', {
  type:'line',
  data:{
    labels,
    datasets:[{
      label:'Price ($)', data,
      borderColor:U.C.blue, backgroundColor:U.C.blueA,
      stepped:'before', fill:true,
      pointRadius:5, pointBackgroundColor:U.C.blue,
      borderWidth:2.5,
    }]
  },
  options: U.baseOpts({
    scales:{
      x: U.xAxis(),
      y: U.yAxis({ ticks:{ ...U.TICK, callback:v=>'$'+v }, min:0, max:100 }),
    }
  })
});

document.querySelectorAll('[data-step]').forEach(btn=>{
  btn.addEventListener('click',function(){
    document.querySelectorAll('[data-step]').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    chart.data.datasets[0].stepped = this.dataset.step;
    chart.update();
  });
});

</script>
</body>
</html>
