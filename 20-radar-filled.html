<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filled radar chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="lib/fonts.googleapis.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <h1>Filled radar chart</h1>
      <p>Heavily filled radar — emphasises the shape/area of performance rather than individual points.</p>
    </div>
    <span class="badge">Radar</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Team skills matrix</h2><p>Average proficiency per skill area</p></div></div>
  <div class="chart-wrap" style="height:380px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script type="module" src="js/20-radar-filled.js"></script>
</body>
</html>
