<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filled radar chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="lib/fonts.googleapis.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <h1>Filled radar chart</h1>
      <p>Heavily filled radar — emphasises the shape/area of performance rather than individual points.</p>
    </div>
    <span class="badge">Radar</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Team skills matrix</h2><p>Average proficiency per skill area</p></div></div>
  <div class="chart-wrap" style="height:380px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script type="module">
import * as U from './js/utils.js';

const axes=['Frontend','Backend','DevOps','Data','Security','Testing'];
const data =[85,78,62,70,55,80];

new Chart('chart',{
  type:'radar',
  data:{
    labels:axes,
    datasets:[{
      label:'Team avg', data,
      borderColor:U.C.teal,
      backgroundColor:'rgba(29,158,117,.35)',
      pointBackgroundColor:U.C.teal,
      borderWidth:2.5, pointRadius:5, fill:true,
    }]
  },
  options: U.baseOpts({
    scales:{ r:{ min:0, max:100, ticks:{ stepSize:20, font:{ size:10 } }, pointLabels:{ font:{ size:13 } }, grid:{ color:'rgba(128,128,128,.15)' } } }
  })
});

</script>
</body>
</html>
