<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Bump chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="lib/fonts.googleapis.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div><h1>Bump chart</h1><p>Rank positions over time — which items rose and which fell across periods.</p></div>
    <span class="badge">Ranking</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Product ranking by revenue</h2><p>Top 6 products — monthly rank, Jan–Jun</p></div></div>
  <div class="legend" id="legend"></div>
  <div class="chart-wrap" style="height:360px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script src="js/40-bump-chart.js"></script>
</body>
</html>
