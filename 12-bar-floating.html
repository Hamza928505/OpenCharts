<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating bar chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="lib/fonts.googleapis.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <h1>Floating bar chart</h1>
      <p>[min, max] ranges per bar — useful for Gantt-style timelines, schedules, or value bands.</p>
    </div>
    <span class="badge">Bar</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Project timeline</h2><p>Week numbers, 2024</p></div></div>
  <div class="chart-wrap" style="height:320px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script type="module" src="js/12-bar-floating.js"></script>
</body>
</html>
