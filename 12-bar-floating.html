<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating bar chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="lib/fonts.googleapis.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <h1>Floating bar chart</h1>
      <p>[min, max] ranges per bar — useful for Gantt-style timelines, schedules, or value bands.</p>
    </div>
    <span class="badge">Bar</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Project timeline</h2><p>Week numbers, 2024</p></div></div>
  <div class="chart-wrap" style="height:320px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script type="module">
import * as U from './js/utils.js';

const tasks = ['Discovery','Design','Development','QA Testing','Launch Prep','Go-Live'];
const ranges= [[1,3],[2,5],[4,10],[8,12],[11,13],[13,14]];
const colors= [U.C.blue,U.C.purple,U.C.teal,U.C.amber,U.C.coral,U.C.pink];

new Chart('chart',{
  type:'bar',
  data:{
    labels:tasks,
    datasets:[{
      label:'Duration',
      data:ranges,
      backgroundColor:colors.map(c=>c+'cc'),
      borderColor:colors,
      borderWidth:1,
      borderRadius:4,
      borderSkipped:false,
    }]
  },
  options: U.baseOpts({
    indexAxis:'y',
    scales:{
      x: U.yAxis({ min:0, max:15, ticks:{ ...U.TICK, callback:v=>'Wk '+v } }),
      y: U.xAxis({ ticks:{ font:{ size:12 } } }),
    }
  })
});

</script>
</body>
</html>
