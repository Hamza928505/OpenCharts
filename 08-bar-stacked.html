<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stacked bar chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="lib/fonts.googleapis.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <h1>Stacked bar chart</h1>
      <p>Segments within each bar show part-to-whole relationships across categories.</p>
    </div>
    <span class="badge">Bar</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Revenue by channel</h2><p>Quarterly breakdown, $M</p></div></div>
  <div class="legend" id="legend"></div>
  <div class="chart-wrap" style="height:320px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script type="module">
import * as U from './js/utils.js';

const chart = new Chart('chart',{
  type:'bar',
  data:{
    labels:U.QTR,
    datasets:[
      { label:'Online',    data:[0.52,0.68,0.74,0.91], backgroundColor:U.C.purple, borderRadius:0, stack:'s' },
      { label:'In-store',  data:[0.31,0.38,0.42,0.51], backgroundColor:U.C.teal,   borderRadius:0, stack:'s' },
      { label:'Wholesale', data:[0.18,0.22,0.24,0.29], backgroundColor:U.C.coral,  borderRadius:4, stack:'s' },
    ]
  },
  options: U.baseOpts({
    scales:{
      x: U.xAxis({ stacked:true }),
      y: U.yAxis({ stacked:true, ticks:{ ...U.TICK, callback:v=>'$'+v.toFixed(2)+'M' } }),
    }
  })
});
U.buildLegend(chart,'legend');

</script>
</body>
</html>
