name: Test

on:
  push:
    branches: [main]
  pull_request:
  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only Chromium — the suite does not test browser differences, and
      # pulling all three browsers triples the install for no added signal.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check syntax
        run: npm run check

      - name: Run the suite
        run: npm test

      # A failing run is far easier to diagnose with the screenshots the
      # suite leaves behind.
      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: test/screenshots/
          if-no-files-found: ignore
          retention-days: 7
