name: Release

# A tag is the whole trigger, so cutting a release is `git tag v2.1.0` and
# `git push --tags`, nothing else. The Release is created by the gh CLI, which
# is preinstalled on the runner and authenticates with the token Actions hands
# out automatically — no third-party action in the supply chain, and no secret
# for anyone to create or rotate.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege by default; each job asks for exactly what it writes.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # creating a Release writes to the repository

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release notes are generated from the history

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check syntax
        run: npm run check

      # A tag that cannot pass the suite is not a release, and — because the
      # publish job below waits on this one — nothing reaches the registry that
      # did not pass it either. Same suite the Test workflow runs on every pull
      # request.
      - name: Run the suite
        run: npm test

      # The site, packed the way npm would: the paths in package.json `files`
      # and nothing else. Unzip it, serve the folder over HTTP, and the gallery
      # runs — which is the whole promise, so the download should keep it.
      - name: Build the download
        run: |
          PATHS=$(node -e "process.stdout.write(require('./package.json').files.join(' '))")
          zip -qr "opencharts-${GITHUB_REF_NAME}.zip" $PATHS
          unzip -l "opencharts-${GITHUB_REF_NAME}.zip" | tail -1

      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "opencharts-${GITHUB_REF_NAME}.zip"

  # The package on https://github.com/Hamza928505/OpenCharts/packages.
  #
  # A separate job on purpose. Publishing needs `packages: write` and a
  # registry-scoped .npmrc, and neither has any business being set while the
  # job above runs `npm ci` against the public registry. `needs: release` means
  # nothing is ever published that did not pass the suite.
  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `workflow_dispatch` puts a branch name in GITHUB_REF_NAME, which is not a
    # version. Only a tag publishes.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # `scope` is what keeps this .npmrc narrow: it routes only
      # @hamza928505/* at GitHub and leaves everything else on npmjs.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@hamza928505'

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, which is worse than failing here.
      - name: The tag and the version must agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is version $TAG, but package.json says $PKG. Bump one to match the other."
            exit 1
          fi
          echo "Publishing $PKG."

      # No build step, so there is nothing to prepare — `files` in package.json
      # already says exactly what ships.
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
