<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Histogram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="lib/fonts.googleapis.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<div class="page">
  <header class="page-header">
    <div><h1>Histogram</h1><p>Frequency distribution of continuous data divided into equal-width bins.</p></div>
    <span class="badge">Bar</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Age distribution of customers</h2><p>n = 2,400 customers</p></div>
    <div class="controls">
      <button class="btn active" data-bins="10">10 bins</button>
      <button class="btn" data-bins="20">20 bins</button>
      <button class="btn" data-bins="30">30 bins</button>
    </div>
  </div>
  <div class="chart-wrap" style="height:340px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script type="module" src="js/26-histogram.js"></script>
</body>
</html>
