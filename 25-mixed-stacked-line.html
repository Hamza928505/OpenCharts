<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stacked bar + trend line</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="lib/fonts.googleapis.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  
</head>
<body>
<div class="page">
  <header class="page-header">
    <div>
      <h1>Stacked bar + trend line</h1>
      <p>Composition of stacked bars combined with an overlaid trend line for the total.</p>
    </div>
    <span class="badge">Mixed</span>
  </header>
  
<div class="card">
  <div class="card-header"><div><h2>Sales by channel + total trend</h2><p>Quarterly, $M</p></div></div>
  <div class="legend" id="legend"></div>
  <div class="chart-wrap" style="height:340px"><canvas id="chart"></canvas></div>
</div>
</div>
<script src="lib/chart.umd.min.js"></script>
<script type="module" src="js/25-mixed-stacked-line.js"></script>
</body>
</html>
